<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NEXUS — B2B Lead Intelligence</title>
<meta name="description" content="Real-estate B2B lead intelligence: scoring, segmentation, and contact enrichment." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── NEXUS · B2B Dashboard (mostly black, subtle accents) ───────── */
:root{
  --bg:#000;            --bg-2:#070708;       --bg-3:#0d0d10;
  --bg-4:#15151a;       --bg-5:#1d1d23;
  --border:#1a1a1f;     --border-2:#26262e;   --border-3:#33333d;
  --text:#ededed;       --text-2:#c8c8c8;
  --muted:#6b6b6b;      --muted-2:#8e8e8e;

  /* Subtle accent palette — desaturated, low-key. Blends with black. */
  --accent:#7aa2f7;                  /* soft steel-blue, primary accent */
  --accent-dim:rgba(122,162,247,.10);
  --accent-2:rgba(122,162,247,.22);
  --hi:#86c5a3;        /* muted sage green — high score */
  --md:#d4b483;        /* dusty amber — medium */
  --lo:#7a7a82;        /* cool gray — low */
  --live:#9ec99b;      /* soft green for "live" pulse */

  --fw-disp:'Syne',sans-serif;
  --fw-mono:'JetBrains Mono',monospace;
  --fw-body:'DM Sans',sans-serif;
  --radius:4px;
  --sidebar-w:220px;   --rpanel-w:340px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--fw-body);font-size:13px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-3);border-radius:2px}

.shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr var(--rpanel-w);grid-template-rows:52px 1fr;height:100vh;overflow:hidden}

/* topbar */
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--bg);position:relative;z-index:10}
.logo{display:flex;align-items:center;gap:10px;width:var(--sidebar-w);padding-right:16px;flex-shrink:0}
.logo-mark{width:26px;height:26px;background:linear-gradient(135deg,var(--text),var(--accent));clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)}
.logo-text{font-family:var(--fw-disp);font-weight:800;font-size:14px;letter-spacing:.14em;color:var(--text)}
.logo-text span{color:var(--accent)}
.search-wrap{flex:1;max-width:520px;position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-wrap input{width:100%;background:var(--bg-3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--fw-mono);font-size:12px;padding:7px 12px 7px 36px;outline:none;transition:border-color .2s,box-shadow .2s}
.search-wrap input::placeholder{color:var(--muted)}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:6px;font-family:var(--fw-mono);font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--border-2);color:var(--muted-2);cursor:pointer}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:0 0 6px var(--live);animation:nx-blink 2s ease-in-out infinite}
@keyframes nx-blink{0%,100%{opacity:1}50%{opacity:.35}}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--bg-4);border:1px solid var(--border-3);display:flex;align-items:center;justify-content:center;font-family:var(--fw-disp);font-weight:700;font-size:11px;color:var(--text)}

/* sidebar */
.sidebar{background:var(--bg);border-right:1px solid var(--border);padding:16px 0;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.nav-section{padding:8px 16px 4px;font-family:var(--fw-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;color:var(--muted-2);font-size:12.5px;border-left:2px solid transparent;transition:all .15s;user-select:none}
.nav-item svg{flex-shrink:0}
.nav-item:hover{color:var(--text);background:var(--bg-2)}
.nav-item.active{color:var(--text);border-left-color:var(--accent);background:linear-gradient(90deg,var(--accent-dim),transparent)}
.nav-item .badge{margin-left:auto;font-family:var(--fw-mono);font-size:10px;padding:1px 6px;border-radius:20px;background:var(--bg-4);color:var(--muted-2)}
.nav-item.active .badge{background:var(--accent-2);color:var(--text)}
.sidebar-footer{margin-top:auto;padding:12px 16px;border-top:1px solid var(--border)}
.usage-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.usage-bar{height:3px;background:var(--bg-4);border-radius:2px;overflow:hidden}
.usage-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--hi));border-radius:2px}

/* main */
.main{background:var(--bg-2);overflow-y:auto;display:flex;flex-direction:column}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border);flex-shrink:0}
.kpi-card{background:var(--bg-2);padding:16px 20px;position:relative;overflow:hidden;transition:background .2s}
.kpi-card:hover{background:var(--bg-3)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--accent);opacity:0;transition:opacity .2s}
.kpi-card:hover::before{opacity:1}
.kpi-label{font-family:var(--fw-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.kpi-value{font-family:var(--fw-disp);font-size:26px;font-weight:700;color:var(--text);line-height:1;margin-bottom:4px}
.kpi-delta{font-family:var(--fw-mono);font-size:10px;display:flex;align-items:center;gap:4px;color:var(--muted-2)}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.toolbar-title{font-family:var(--fw-disp);font-size:14px;font-weight:700;letter-spacing:.04em}
.tab-group{display:flex;gap:2px;background:var(--bg-3);border-radius:var(--radius);padding:3px;border:1px solid var(--border)}
.tab{font-family:var(--fw-mono);font-size:11px;padding:4px 12px;border-radius:3px;cursor:pointer;color:var(--muted);user-select:none;transition:all .15s}
.tab.active{background:var(--bg-5);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent-2)}
.tab:hover:not(.active){color:var(--text)}
.filter-btn{display:flex;align-items:center;gap:6px;background:var(--bg-3);border:1px solid var(--border);border-radius:var(--radius);padding:5px 12px;font-family:var(--fw-mono);font-size:11px;color:var(--muted-2);cursor:pointer}
.filter-btn:hover{border-color:var(--accent);color:var(--text)}
.ml-auto{margin-left:auto}
.btn-primary{display:flex;align-items:center;gap:6px;background:var(--accent);border:none;border-radius:var(--radius);padding:6px 14px;font-family:var(--fw-mono);font-size:11px;font-weight:600;color:#0a1020;cursor:pointer;transition:all .2s}
.btn-primary:hover{filter:brightness(1.1)}

/* table */
.lead-table-wrap{flex:1;overflow-y:auto}
table{width:100%;border-collapse:collapse}
thead{position:sticky;top:0;z-index:2;background:var(--bg)}
th{padding:10px 16px;text-align:left;font-family:var(--fw-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover td{background:var(--bg-3)}
tbody tr.selected td{background:var(--bg-4)!important}
tbody tr.selected td:first-child{border-left:2px solid var(--accent);padding-left:14px}

.company-cell{display:flex;align-items:center;gap:10px}
.company-logo{width:30px;height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--fw-disp);font-weight:800;font-size:11px;flex-shrink:0;border:1px solid var(--border-2);background:var(--bg-4);color:var(--text)}
.company-name{font-weight:500;font-size:12.5px;color:var(--text);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.company-domain{font-family:var(--fw-mono);font-size:10px;color:var(--muted);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.score-badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--fw-mono);font-size:11px;font-weight:600;padding:3px 8px;border-radius:3px;min-width:48px;justify-content:center;background:var(--bg-4);border:1px solid var(--border-2)}
.score-ring{width:7px;height:7px;border-radius:50%}
.score-hi{color:var(--hi)}.score-md{color:var(--md)}.score-lo{color:var(--lo)}
.score-ring-hi{background:var(--hi);box-shadow:0 0 5px var(--hi)}
.score-ring-md{background:var(--md)}
.score-ring-lo{background:var(--lo)}

.intent-tag{font-family:var(--fw-mono);font-size:10px;padding:2px 8px;border-radius:20px;white-space:nowrap;background:var(--bg-4);border:1px solid var(--border-2);color:var(--muted-2)}
.action-btn{width:26px;height:26px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;text-decoration:none}
.action-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--bg-4)}

/* right panel */
.rpanel{background:var(--bg);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.rpanel-header{padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:2;flex-shrink:0}
.rpanel-company{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rpanel-logo{width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--fw-disp);font-weight:800;font-size:15px;border:1px solid var(--border-3);background:var(--bg-4);color:var(--text)}
.rpanel-name{font-family:var(--fw-disp);font-size:14px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rpanel-url{font-family:var(--fw-mono);font-size:10px;color:var(--muted-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.rpanel-score-row{display:flex;align-items:center;gap:10px}
.score-lg{font-family:var(--fw-disp);font-size:32px;font-weight:800;line-height:1}
.score-meta{display:flex;flex-direction:column}
.score-meta span:first-child{font-size:10px;color:var(--muted);font-family:var(--fw-mono)}
.score-meta span:last-child{font-size:11px;color:var(--text-2);font-family:var(--fw-mono);font-weight:600}
.score-bar-wrap{flex:1;height:5px;background:var(--bg-4);border-radius:3px;overflow:hidden;margin:0 6px}
.score-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--hi));transition:width 1s cubic-bezier(.16,1,.3,1)}

.rpanel-section{padding:14px 18px;border-bottom:1px solid var(--border)}
.section-title{font-family:var(--fw-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-key{font-size:10px;color:var(--muted);margin-bottom:2px;font-family:var(--fw-mono);letter-spacing:.05em;text-transform:uppercase}
.info-val{font-size:12px;color:var(--text);font-weight:500;word-break:break-word}
.info-val.mono{font-family:var(--fw-mono)}
.info-val a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent-2)}
.info-val a:hover{border-bottom-style:solid}

.rpanel-actions{padding:14px 18px;display:flex;gap:8px}
.btn-outline{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border-2);background:transparent;border-radius:var(--radius);padding:7px;font-family:var(--fw-mono);font-size:11px;color:var(--muted-2);cursor:pointer;text-decoration:none;transition:all .15s}
.btn-outline:hover{border-color:var(--accent);color:var(--text);background:var(--bg-3)}
.btn-outline.accent{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.btn-outline:disabled{opacity:.4}

.empty-row td{text-align:center;padding:60px 20px;color:var(--muted);font-family:var(--fw-mono);font-size:11px}
.skel{background:linear-gradient(90deg,var(--bg-3) 25%,var(--bg-4) 50%,var(--bg-3) 75%);background-size:800px 100%;animation:nx-shimmer 1.4s infinite;border-radius:3px;height:11px;width:80%}
@keyframes nx-shimmer{from{background-position:-800px 0}to{background-position:800px 0}}
@keyframes nx-fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
tbody tr{animation:nx-fadein .25s ease both}

/* pagination */
.pagination{display:flex;gap:4px;justify-content:center;padding:14px;align-items:center;border-top:1px solid var(--border);background:var(--bg)}
.pg-btn{padding:5px 11px;border-radius:var(--radius);border:1px solid var(--border-2);background:var(--bg-3);color:var(--muted-2);font-family:var(--fw-mono);font-size:10px;cursor:pointer}
.pg-btn:hover:not(:disabled){color:var(--text);border-color:var(--accent)}
.pg-btn.active{background:var(--accent);color:#0a1020;border-color:var(--accent)}
.pg-btn:disabled{opacity:.35;cursor:not-allowed}
</style>
</head>
<body>
<div class="shell">
  <!-- topbar -->
  <header class="topbar">
    <div class="logo">
      <div class="logo-mark"></div>
      <span class="logo-text">NEX<span>US</span></span>
    </div>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="text" placeholder="Search by location, area…" />
    </div>
    <div class="topbar-right">
      <div class="pill"><div class="dot"></div>Live sync</div>
      <div class="avatar">ZI</div>
    </div>
  </header>

  <!-- sidebar -->
  <nav class="sidebar" id="sidebar"></nav>

  <!-- main -->
  <main class="main">
    <div class="kpi-strip" id="kpis"></div>

    <div class="toolbar">
      <span class="toolbar-title">Lead Intelligence</span>
      <div class="tab-group" id="tabs">
        <div class="tab active" data-tab="all">All</div>
        <div class="tab" data-tab="hot">Hot ≥70</div>
        <div class="tab" data-tab="engaged">Engaged ≥40</div>
        <div class="tab" data-tab="new">Newest</div>
      </div>
      <div class="filter-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        Filters
      </div>
      <div class="ml-auto"></div>
      <button class="btn-primary" id="exportBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export CSV
      </button>
    </div>

    <div class="lead-table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:36px"><input type="checkbox"></th>
            <th>Property / Agent</th>
            <th>Score</th>
            <th>Segment</th>
            <th>Price</th>
            <th>Area</th>
            <th>Beds</th>
            <th>₨ / sqft</th>
            <th>Location</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="leadBody"></tbody>
      </table>
    </div>

    <div class="pagination" id="pagination" style="display:none"></div>
  </main>

  <!-- right panel -->
  <aside class="rpanel" id="rpanel"></aside>
</div>

<script>
const API = "https://b2b-lead-intelligence-platform-1.onrender.com";

const state = {
  tab: "all", search: "", page: 1, pages: 1, total: 0, limit: 25,
  leads: null, summary: null, selectedId: null, activeNav: "leads"
};

const NAV = [
  { label:"Workspace", items:[
    { key:"dashboard", name:"Dashboard", icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>' },
    { key:"leads", name:"Lead Database", badge:"live", icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>' },
    { key:"intent", name:"Intent Signals", icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>' },
    { key:"company", name:"Company Intel", icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>' },
    { key:"pipeline", name:"Pipeline", icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>' },
  ]},
  { label:"Enrich", items:[
    { key:"prospector", name:"Prospector", icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>' },
    { key:"reports", name:"Reports", icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' },
  ]},
];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => { if (n==null||isNaN(+n)) return "–"; const v=+n; if (v>=1e7) return (v/1e7).toFixed(1)+" Cr"; if (v>=1e5) return (v/1e5).toFixed(1)+" L"; return v.toLocaleString(); };
const fmtArea = n => (!n||isNaN(+n))?"–":(+n).toLocaleString(undefined,{maximumFractionDigits:0})+" sqft";
const fmtN = (n,d=1) => (n==null||isNaN(+n))?"–":(+n).toFixed(d);
const scoreTier = s => s>=70?"hi":s>=40?"md":"lo";
const scoreLabel = s => s>=70?"HIGH":s>=40?"MED":"LOW";
const initials = str => { if (!str) return "—"; const p=String(str).trim().split(/\s+/); return ((p[0]?.[0]||"")+(p[1]?.[0]||"")).toUpperCase()||"—"; };

async function apiGet(path){
  try { const r = await fetch(API+path); if (!r.ok) throw new Error(r.statusText); return await r.json(); }
  catch(e){ console.error("API error:",path,e); return {}; }
}

function renderSidebar(){
  const total = state.total;
  const badgeVal = total ? (total>999?(total/1000).toFixed(1)+"k":total) : "—";
  const html = NAV.map(sec => `
    <div>
      <div class="nav-section">${sec.label}</div>
      ${sec.items.map(it => `
        <div class="nav-item ${state.activeNav===it.key?"active":""}" data-nav="${it.key}">
          ${it.icon}${it.name}
          ${it.badge?`<span class="badge">${it.badge==="live"?badgeVal:it.badge}</span>`:""}
        </div>`).join("")}
    </div>`).join("") + `
    <div class="sidebar-footer">
      <div class="usage-label"><span>Avg score</span><span style="color:var(--text)">${fmtN(state.summary?.avg_lead_score,1)} / 100</span></div>
      <div class="usage-bar"><div class="usage-fill" style="width:${Math.min(100,Math.max(0,+(state.summary?.avg_lead_score||0)))}%"></div></div>
    </div>`;
  const el = document.getElementById("sidebar");
  el.innerHTML = html;
  el.querySelectorAll("[data-nav]").forEach(n => n.onclick = () => { state.activeNav = n.dataset.nav; renderSidebar(); });
}

function renderKpis(){
  const s = state.summary || {};
  const kpis = [
    { label:"Total Leads", val: s.total_leads!=null?(+s.total_leads).toLocaleString():"—", note:"All-time scraped" },
    { label:"Today's Listings", val: s.today_leads ?? "—", note:"Scraped today" },
    { label:"Avg Lead Score", val: fmtN(s.avg_lead_score,1), note:"/ 100 ML quality" },
    { label:"Verified Agencies", val: s.verified_agencies ?? "—", note:"Of all listings" },
  ];
  document.getElementById("kpis").innerHTML = kpis.map(k => `
    <div class="kpi-card">
      <div class="kpi-label">${esc(k.label)}</div>
      <div class="kpi-value">${esc(k.val)}</div>
      <div class="kpi-delta">${esc(k.note)}</div>
    </div>`).join("");
}

function renderLeads(){
  const body = document.getElementById("leadBody");
  if (state.leads == null){
    body.innerHTML = Array.from({length:8}).map(()=>`<tr>${Array.from({length:10}).map(()=>`<td><div class="skel"></div></td>`).join("")}</tr>`).join("");
    return;
  }
  if (!state.leads.length){
    body.innerHTML = `<tr class="empty-row"><td colspan="10">No leads found</td></tr>`;
    return;
  }
  body.innerHTML = state.leads.map(l => {
    const id = l.property_id ?? "";
    const s = Math.round(l.lead_score || 0);
    const tier = scoreTier(s);
    const psf = l.price_per_sqft ? "₨"+(+l.price_per_sqft).toLocaleString(undefined,{maximumFractionDigits:0}) : "–";
    const linkBtn = l.link ? `<a class="action-btn" href="${esc(l.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Open listing"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>` : "";
    return `
      <tr data-id="${esc(id)}" class="${String(state.selectedId)===String(id)?"selected":""}">
        <td onclick="event.stopPropagation()"><input type="checkbox"></td>
        <td>
          <div class="company-cell">
            <div class="company-logo">${esc(initials(l.agency_name||l.agent_name||l.title))}</div>
            <div style="min-width:0">
              <div class="company-name" title="${esc(l.title||"")}">${esc(l.title||"Untitled")}</div>
              <div class="company-domain">${esc(l.agent_name||"—")}${l.agency_name?" · "+esc(l.agency_name):""}</div>
            </div>
          </div>
        </td>
        <td><div class="score-badge score-${tier}"><div class="score-ring score-ring-${tier}"></div>${s}</div></td>
        <td><span class="intent-tag">${esc(l.market_segment||"—")}</span></td>
        <td style="font-family:var(--fw-mono);color:var(--text);white-space:nowrap">${esc(fmt(l.price))}</td>
        <td style="font-family:var(--fw-mono);font-size:11px;color:var(--muted-2)">${esc(fmtArea(l.area_sqft))}</td>
        <td style="font-family:var(--fw-mono);font-size:11px;color:var(--muted-2)">${esc(l.bedrooms ?? "–")}</td>
        <td style="font-family:var(--fw-mono);font-size:11px;color:var(--muted-2)">${esc(psf)}</td>
        <td style="color:var(--muted-2);font-size:11px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.location||"—")}</td>
        <td><div style="display:flex;gap:4px">${linkBtn}</div></td>
      </tr>`;
  }).join("");
  body.querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = () => { state.selectedId = tr.dataset.id; renderLeads(); renderRpanel(); });
}

function renderPagination(){
  const el = document.getElementById("pagination");
  if (state.pages <= 1){ el.style.display="none"; return; }
  el.style.display = "flex";
  const btns = [];
  btns.push(`<button class="pg-btn" ${state.page<=1?"disabled":""} data-pg="prev">← Prev</button>`);
  for (let i=1; i<=Math.min(state.pages,7); i++) btns.push(`<button class="pg-btn ${i===state.page?"active":""}" data-pg="${i}">${i}</button>`);
  btns.push(`<button class="pg-btn" ${state.page>=state.pages?"disabled":""} data-pg="next">Next →</button>`);
  btns.push(`<span style="margin-left:12px;font-family:var(--fw-mono);font-size:10px;color:var(--muted)">${state.total.toLocaleString()} leads</span>`);
  el.innerHTML = btns.join("");
  el.querySelectorAll("button[data-pg]").forEach(b => b.onclick = () => {
    const v = b.dataset.pg;
    if (v==="prev") state.page = Math.max(1, state.page-1);
    else if (v==="next") state.page = Math.min(state.pages, state.page+1);
    else state.page = +v;
    loadLeads();
  });
}

function renderRpanel(){
  const el = document.getElementById("rpanel");
  const lead = (state.leads||[]).find(l => String(l.property_id) === String(state.selectedId)) || (state.leads||[])[0] || null;
  if (!lead){
    el.innerHTML = `
      <div class="rpanel-header">
        <div class="rpanel-company">
          <div class="rpanel-logo">—</div>
          <div><div class="rpanel-name">Select a lead</div><div class="rpanel-url">No selection</div></div>
        </div>
      </div>`;
    return;
  }
  const s = Math.round(lead.lead_score || 0);
  const tier = scoreTier(s);
  const isVer = String(lead.verified_agency||"").toLowerCase() === "verified";
  const psf = lead.price_per_sqft ? "₨"+(+lead.price_per_sqft).toLocaleString(undefined,{maximumFractionDigits:0}) : "–";

  el.innerHTML = `
    <div class="rpanel-header">
      <div class="rpanel-company">
        <div class="rpanel-logo">${esc(initials(lead.agency_name||lead.agent_name||lead.title))}</div>
        <div style="min-width:0;flex:1">
          <div class="rpanel-name" title="${esc(lead.title||"")}">${esc(lead.title||"Untitled")}</div>
          <div class="rpanel-url" title="${esc(lead.location||"")}">${esc(lead.location||"—")}</div>
        </div>
      </div>
      <div class="rpanel-score-row">
        <div class="score-lg score-${tier}">${s}</div>
        <div class="score-bar-wrap"><div class="score-bar-fill" style="width:${s}%"></div></div>
        <div class="score-meta"><span>Lead Score</span><span>${scoreLabel(s)}</span></div>
      </div>
    </div>

    <div class="rpanel-actions">
      ${lead.phone_number
        ? `<a class="btn-outline accent" href="tel:${esc(lead.phone_number)}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72"/></svg>Call</a>`
        : `<button class="btn-outline" disabled>No phone</button>`}
      ${lead.email
        ? `<a class="btn-outline" href="mailto:${esc(lead.email)}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Email</a>`
        : `<button class="btn-outline" disabled>No email</button>`}
      ${lead.link
        ? `<a class="btn-outline" href="${esc(lead.link)}" target="_blank" rel="noopener"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>View</a>`
        : ""}
    </div>

    <div class="rpanel-section">
      <div class="section-title">Property Intel</div>
      <div class="info-grid">
        <div><div class="info-key">Price</div><div class="info-val mono">${esc(fmt(lead.price))}</div></div>
        <div><div class="info-key">₨ / sqft</div><div class="info-val mono">${esc(psf)}</div></div>
        <div><div class="info-key">Area</div><div class="info-val mono">${esc(fmtArea(lead.area_sqft))}</div></div>
        <div><div class="info-key">Bedrooms</div><div class="info-val mono">${esc(lead.bedrooms ?? "–")}</div></div>
        <div><div class="info-key">Bathrooms</div><div class="info-val mono">${esc(lead.bathrooms ?? "–")}</div></div>
        <div><div class="info-key">Segment</div><div class="info-val">${esc(lead.market_segment||"–")}</div></div>
        <div><div class="info-key">Property ID</div><div class="info-val mono" style="font-size:11px">${esc(lead.property_id ?? "–")}</div></div>
        <div><div class="info-key">Posted</div><div class="info-val mono" style="font-size:11px">${esc(lead.posted_date||"–")}</div></div>
      </div>
    </div>

    <div class="rpanel-section">
      <div class="section-title">Agent &amp; Agency</div>
      <div class="info-grid">
        <div><div class="info-key">Agent</div><div class="info-val">${esc(lead.agent_name||"–")}</div></div>
        <div><div class="info-key">Agency</div><div class="info-val">${esc(lead.agency_name||"–")}</div></div>
        <div><div class="info-key">Verified</div><div class="info-val">${isVer?"✓ Verified":"Not verified"}</div></div>
        <div><div class="info-key">Listings</div><div class="info-val mono">${esc(lead.total_agent_listings ?? "–")}</div></div>
      </div>
    </div>

    <div class="rpanel-section">
      <div class="section-title">Contact</div>
      <div class="info-grid" style="grid-template-columns:1fr">
        <div><div class="info-key">Phone</div><div class="info-val mono">${lead.phone_number?`<a href="tel:${esc(lead.phone_number)}">${esc(lead.phone_number)}</a>`:"–"}</div></div>
        <div><div class="info-key">Email</div><div class="info-val">${lead.email?`<a href="mailto:${esc(lead.email)}">${esc(lead.email)}</a>`:"–"}</div></div>
        <div><div class="info-key">Listing</div><div class="info-val">${lead.link?`<a href="${esc(lead.link)}" target="_blank" rel="noopener">zameen.com ↗</a>`:"–"}</div></div>
        <div><div class="info-key">Agency Profile</div><div class="info-val">${lead.agency_url?`<a href="${esc(lead.agency_url)}" target="_blank" rel="noopener">View Profile ↗</a>`:"–"}</div></div>
      </div>
    </div>

    ${lead.description?`<div class="rpanel-section"><div class="section-title">Description</div><div style="font-size:11.5px;color:var(--text-2);line-height:1.6;max-height:160px;overflow:auto">${esc(lead.description)}</div></div>`:""}
  `;
}

async function loadSummary(){
  state.summary = await apiGet("/api/summary");
  renderKpis(); renderSidebar();
}

async function loadLeads(){
  state.leads = null; renderLeads();
  const params = new URLSearchParams({ page:String(state.page), limit:String(state.limit), sort_by:"lead_score" });
  if (state.tab==="hot") params.set("min_score","70");
  if (state.tab==="engaged") params.set("min_score","40");
  if (state.search.trim()) params.set("location", state.search.trim());
  const data = await apiGet("/api/leads?"+params.toString());
  const arr = data.leads || [];
  state.leads = arr;
  state.total = data.total ?? arr.length;
  state.pages = data.pages ?? 1;
  if (arr.length && state.selectedId == null) state.selectedId = arr[0].property_id ?? null;
  renderSidebar(); renderLeads(); renderPagination(); renderRpanel();
}

// wire events
document.getElementById("search").addEventListener("input", e => {
  state.search = e.target.value; state.page = 1;
  clearTimeout(window.__sd); window.__sd = setTimeout(loadLeads, 300);
});
document.querySelectorAll("#tabs .tab").forEach(t => t.onclick = () => {
  document.querySelectorAll("#tabs .tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  state.tab = t.dataset.tab; state.page = 1; loadLeads();
});
document.getElementById("exportBtn").onclick = () => {
  if (!state.leads?.length) return;
  const headers = ["title","location","price","area_sqft","bedrooms","bathrooms","lead_score","market_segment","agent_name","agency_name","phone_number","email","link"];
  const csv = [headers.join(","), ...state.leads.map(l => headers.map(h => `"${String(l[h]??"").replace(/"/g,'""')}"`).join(","))].join("\n");
  const blob = new Blob([csv],{type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `nexus-leads-page-${state.page}.csv`; a.click();
  URL.revokeObjectURL(url);
};

renderSidebar(); renderKpis(); renderLeads(); renderRpanel();
loadSummary(); loadLeads();
</script>
</body>
</html>
