<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zameen Intel · B2B Lead Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #07080d;
      --bg2:      #0b0d14;
      --surf:     #0f1118;
      --surf2:    #13151f;
      --surf3:    #181b27;
      --border:   #1e2132;
      --border2:  #252840;
      --accent:   #4f8fff;
      --accent2:  #3a6fd4;
      --accentg:  rgba(79,143,255,.08);
      --green:    #34d399;
      --orange:   #fb923c;
      --yellow:   #fbbf24;
      --red:      #f87171;
      --purple:   #a78bfa;
      --text:     #e2e8f5;
      --text2:    #6b7a9e;
      --text3:    #353d56;
      --mono:     "DM Mono", monospace;
      --sans:     "Syne", sans-serif;
      --r:        8px;
      --rl:       12px;
      --sidebar:  220px;
      --shadow:   0 4px 24px rgba(0,0,0,.6);
      --shadow-sm:0 2px 8px rgba(0,0,0,.4);
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent2); }

    @keyframes fadeUp   { from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);} }
    @keyframes pulse    { 0%,100%{opacity:1;}50%{opacity:.25;} }
    @keyframes shimmer  { from{background-position:-600px 0}to{background-position:600px 0} }
    @keyframes spin     { to{transform:rotate(360deg)} }

    .skel {
      background: linear-gradient(90deg, var(--surf) 25%, var(--surf2) 50%, var(--surf) 75%);
      background-size: 600px 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--r);
    }
    .fade { animation: fadeUp .3s ease both; }
    .d1{animation-delay:.05s} .d2{animation-delay:.1s} .d3{animation-delay:.15s}
    .d4{animation-delay:.2s}  .d5{animation-delay:.25s} .d6{animation-delay:.3s}

    /* ── Layout ── */
    #app { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar);
      min-width: var(--sidebar);
      background: var(--surf);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .main { flex: 1; min-width: 0; padding: 32px 40px 64px; }

    /* ── Sidebar ── */
    .brand {
      padding: 28px 20px 22px;
      border-bottom: 1px solid var(--border);
    }
    .brand-eyebrow {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--accent);
      letter-spacing: 2.5px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 7px;
      opacity: .9;
    }
    .live-dot {
      display: inline-block;
      width: 5px; height: 5px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
      box-shadow: 0 0 8px var(--accent);
      flex-shrink: 0;
    }
    .brand-logo {
      font-family: var(--sans);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.5px;
      line-height: 1;
      margin-bottom: 5px;
    }
    .brand-logo span { color: var(--accent); }
    .brand-sub {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--text3);
      letter-spacing: 1.5px;
    }

    .nav-section { padding: 18px 12px 4px; }
    .nav-label {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--text3);
      letter-spacing: 3px;
      padding: 0 8px;
      margin-bottom: 4px;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--r);
      color: var(--text2);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      transition: all .15s;
      position: relative;
    }
    .nav-link::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 2px;
      background: var(--accent);
      border-radius: 2px;
      opacity: 0;
      transition: opacity .15s;
    }
    .nav-link:hover { color: var(--text); background: rgba(255,255,255,.03); }
    .nav-link.active { color: var(--accent); background: var(--accentg); }
    .nav-link.active::before { opacity: 1; }
    .nav-icon { font-size: 13px; width: 18px; text-align: center; flex-shrink: 0; opacity: .8; }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 18px;
      border-top: 1px solid var(--border);
    }
    .sf-line { font-family: var(--mono); font-size: 8px; color: var(--text3); line-height: 1.9; }
    .sf-kv { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .sf-k { font-family: var(--mono); font-size: 8px; color: var(--text3); }
    .sf-v { font-family: var(--mono); font-size: 11px; color: var(--accent); font-weight: 500; }

    /* ── Page header ── */
    .pg-eyebrow {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--accent);
      letter-spacing: 3px;
      margin-bottom: 6px;
      opacity: .8;
    }
    .pg-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.8px;
      margin-bottom: 4px;
      line-height: 1.1;
    }
    .pg-sub { color: var(--text2); font-size: 12px; margin-bottom: 30px; }
    .pg-hdr { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 30px; }
    .pg-hdr-meta {
      text-align: right;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text3);
      line-height: 2;
    }

    /* ── KPI Grid ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px; }
    .kpi-card {
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: var(--rl);
      padding: 18px 16px 14px;
      position: relative;
      overflow: hidden;
      transition: border-color .2s, box-shadow .2s;
    }
    .kpi-card::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
    }
    .kpi-card:hover { border-color: var(--border2); box-shadow: var(--shadow-sm); }
    .kpi-glow { position: absolute; top: 0; left: 0; right: 0; height: 1px; }
    .kpi-label {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--text3);
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }
    .kpi-val {
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
    }
    .kpi-unit { font-size: 11px; color: var(--text2); margin-left: 2px; font-weight: 400; letter-spacing: 0; }
    .kpi-note { font-family: var(--mono); font-size: 8px; color: var(--text3); margin-top: 8px; }

    /* ── Panel ── */
    .panel {
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: var(--rl);
      padding: 20px;
    }
    .panel-eyebrow {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--text3);
      letter-spacing: 2px;
      margin-bottom: 3px;
    }
    .panel-title { font-weight: 700; font-size: 13px; margin-bottom: 16px; }

    .g2   { display: grid; grid-template-columns: 1fr 280px; gap: 12px; margin-bottom: 12px; }
    .g2eq { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .g3   { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .g4   { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }

    /* ── Table ── */
    .tbl-wrap {
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: var(--rl);
      overflow: hidden;
      margin-bottom: 12px;
    }
    .tbl-hdr {
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surf2);
    }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: var(--surf2); }
    th {
      padding: 9px 16px;
      text-align: left;
      font-family: var(--mono);
      font-size: 8px;
      color: var(--text3);
      letter-spacing: 2px;
      font-weight: 500;
      white-space: nowrap;
    }
    td {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(79,143,255,.025); }

    /* ── Score bar ── */
    .score-bar-wrap { display: flex; align-items: center; gap: 8px; }
    .score-bar-bg { flex: 1; height: 3px; background: var(--border2); border-radius: 2px; overflow: hidden; min-width: 48px; }
    .score-bar-fill { height: 100%; border-radius: 2px; }

    /* ── Badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 9px;
      font-weight: 500;
      font-family: var(--mono);
      white-space: nowrap;
    }
    .badge-verified {
      background: rgba(52,211,153,.1);
      color: var(--green);
      border: 1px solid rgba(52,211,153,.25);
    }

    /* ── Filter bar ── */
    .filter-bar {
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: var(--rl);
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .fg label {
      display: block;
      font-family: var(--mono);
      font-size: 8px;
      color: var(--text3);
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    select, input[type=text], input[type=number] {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: var(--r);
      padding: 7px 11px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    select:focus, input:focus {
      border-color: rgba(79,143,255,.5);
      box-shadow: 0 0 0 3px rgba(79,143,255,.07);
    }
    .btn-reset {
      background: transparent;
      border: 1px solid var(--border2);
      border-radius: var(--r);
      padding: 7px 14px;
      color: var(--text3);
      font-family: var(--mono);
      font-size: 9px;
      cursor: pointer;
      transition: all .15s;
      align-self: flex-end;
    }
    .btn-reset:hover { border-color: var(--red); color: var(--red); }
    .filter-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text2);
      align-self: flex-end;
      padding-bottom: 7px;
      margin-left: auto;
    }

    /* ── Lead card ── */
    .lead-card {
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: var(--rl);
      margin-bottom: 8px;
      overflow: hidden;
      border-left: 3px solid transparent;
      transition: border-color .2s, box-shadow .2s;
    }
    .lead-card:hover { box-shadow: 0 8px 32px rgba(0,0,0,.5); }
    .lead-hdr {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      cursor: pointer;
      user-select: none;
    }
    .lead-title {
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
      max-width: 500px;
    }
    .lead-chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 5px; }
    .chip { font-family: var(--mono); font-size: 10px; color: var(--text2); }
    .chip-sep { color: var(--text3); }
    .lead-loc {
      font-size: 11px;
      color: var(--text3);
      font-family: var(--mono);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .lead-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .score-big { text-align: right; }
    .score-big-num { font-family: var(--mono); font-size: 26px; font-weight: 500; line-height: 1; }
    .score-big-lbl { font-family: var(--mono); font-size: 7px; color: var(--text3); letter-spacing: 2px; margin-top: 3px; }
    .expand-icon { font-family: var(--mono); font-size: 9px; color: var(--text3); margin-top: 4px; }

    .lead-body { display: none; border-top: 1px solid var(--border); }
    .lead-body-inner { padding: 18px 20px; }

    /* ── Detail sections ── */
    .ld-section { margin-bottom: 18px; }
    .ld-section-title {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--accent);
      letter-spacing: 3px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
      opacity: .8;
    }
    .ld-grid  { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px 18px; }
    .ld-grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px 18px; }
    .ld-grid2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px 18px; }
    .lf-label { font-family: var(--mono); font-size: 7px; color: var(--text3); letter-spacing: 1.5px; margin-bottom: 5px; }
    .lf-val   { font-size: 12px; color: var(--text); word-break: break-word; }
    .lf-val a { color: var(--accent); text-decoration: none; }
    .lf-val a:hover { text-decoration: underline; }
    .lf-val.mono { font-family: var(--mono); }

    .lead-desc {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-left: 2px solid var(--border2);
      border-radius: var(--r);
      padding: 12px 16px;
      font-size: 11px;
      color: var(--text2);
      line-height: 1.7;
      margin-bottom: 16px;
      max-height: 88px;
      overflow: hidden;
      position: relative;
    }
    .lead-desc::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 28px;
      background: linear-gradient(transparent, var(--bg2));
    }

    /* ── Action row ── */
    .lead-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      margin-top: 6px;
    }
    .cta-label { font-family: var(--mono); font-size: 7px; color: var(--text3); letter-spacing: 2px; margin-right: 4px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: var(--r);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all .15s;
      white-space: nowrap;
      padding: 7px 14px;
      border: 1px solid transparent;
    }
    .btn-accent { background: rgba(79,143,255,.1); border-color: rgba(79,143,255,.25); color: var(--accent); }
    .btn-accent:hover { background: rgba(79,143,255,.18); border-color: rgba(79,143,255,.4); }
    .btn-green  { background: rgba(52,211,153,.1); border-color: rgba(52,211,153,.25); color: var(--green); }
    .btn-green:hover  { background: rgba(52,211,153,.18); }
    .btn-ghost  { background: transparent; border-color: var(--border2); color: var(--text2); }
    .btn-ghost:hover  { border-color: var(--text2); color: var(--text); }

    /* ── Pagination ── */
    .pagination { display: flex; gap: 5px; justify-content: center; margin-top: 24px; align-items: center; }
    .pg-btn {
      padding: 6px 12px;
      border-radius: var(--r);
      border: 1px solid var(--border2);
      background: var(--surf2);
      color: var(--text2);
      font-family: var(--mono);
      font-size: 10px;
      cursor: pointer;
      transition: all .15s;
    }
    .pg-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
    .pg-btn:hover:not(.active) { color: var(--text); border-color: var(--text3); }
    .pg-ellipsis { color: var(--text3); font-family: var(--mono); font-size: 10px; padding: 0 4px; }

    /* ── Segment card ── */
    .seg-card {
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: var(--rl);
      padding: 20px;
      transition: transform .2s, box-shadow .2s;
    }
    .seg-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    .seg-hdr { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .seg-swatch { width: 3px; height: 44px; border-radius: 2px; flex-shrink: 0; }
    .seg-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .seg-stat { background: var(--bg2); border-radius: var(--r); padding: 10px 12px; border: 1px solid var(--border); }
    .seg-stat-label { font-family: var(--mono); font-size: 7px; color: var(--text3); letter-spacing: 1.5px; margin-bottom: 4px; }
    .seg-stat-val { font-family: var(--mono); font-size: 16px; font-weight: 500; }

    /* ── Location bars ── */
    .loc-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
    .loc-rank { font-family: var(--mono); font-size: 8px; color: var(--text3); min-width: 18px; text-align: right; }
    .loc-bar-bg { flex: 1; height: 2px; background: var(--border); border-radius: 1px; }
    .loc-bar-fill { height: 100%; background: var(--accent); border-radius: 1px; opacity: .45; }

    /* ── Mini stat ── */
    .mini-stat { background: var(--surf); border: 1px solid var(--border); border-radius: var(--rl); padding: 16px 18px; }
    .mini-stat-label { font-family: var(--mono); font-size: 8px; color: var(--text3); letter-spacing: 2px; margin-bottom: 7px; }
    .mini-stat-val { font-family: var(--mono); font-size: 22px; font-weight: 500; }

    /* ── Empty ── */
    .empty { text-align: center; padding: 64px 20px; color: var(--text3); }
    .empty-icon { font-size: 32px; margin-bottom: 14px; opacity: .3; }
    .empty-text { font-family: var(--mono); font-size: 11px; }

    /* ── Divider ── */
    .section-divider {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border), transparent);
      margin: 20px 0;
    }

    @media(max-width:1280px) { .kpi-grid{grid-template-columns:repeat(3,1fr);} }
    @media(max-width:1000px) { .g2{grid-template-columns:1fr;} .ld-grid{grid-template-columns:repeat(2,1fr);} }
    @media(max-width:800px)  { .g3{grid-template-columns:1fr 1fr;} .lead-title{max-width:260px;} }
  </style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-eyebrow"><span class="live-dot"></span>LIVE INTELLIGENCE</div>
      <div class="brand-logo">Zameen<span>Intel</span></div>
      <div class="brand-sub">KARACHI · REAL ESTATE B2B</div>
    </div>

    <div class="nav-section">
      <div class="nav-label">OVERVIEW</div>
      <button class="nav-link active" onclick="showPage('dashboard',this)"><span class="nav-icon">◈</span>Dashboard</button>
      <button class="nav-link" onclick="showPage('analytics',this)"><span class="nav-icon">◉</span>Analytics</button>
    </div>
    <div class="nav-section">
      <div class="nav-label">LEADS</div>
      <button class="nav-link" onclick="showPage('leads',this)"><span class="nav-icon">⬡</span>All Leads</button>
      <button class="nav-link" onclick="showPage('segments',this)"><span class="nav-icon">▣</span>Segments</button>
    </div>

    <div class="sidebar-footer">
      <div class="sf-line">Zameen.com · Karachi Flats</div>
      <div class="sf-line">Daily scrape + ML scoring</div>
      <div id="sb-stats">
        <div class="sf-kv"><span class="sf-k">TOTAL LEADS</span><span class="sf-v" id="sb-total">—</span></div>
        <div class="sf-kv"><span class="sf-k">TODAY</span><span class="sf-v" id="sb-today">—</span></div>
        <div class="sf-kv"><span class="sf-k">AVG SCORE</span><span class="sf-v" id="sb-score">—</span></div>
      </div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script>
// ── Config ────────────────────────────────────────────────────
const API = window.location.hostname === 'localhost'
  ? 'http://localhost:8000'
  : 'https://b2b-lead-intelligence-platform-1.onrender.com';

const SEG_COLOR = {
  "Budget Area":    "#4f8fff",
  "Mid-Value Area": "#34d399",
  "Premium Area":   "#fbbf24",
  "Luxury Area":    "#fb923c"
};

const SEG_DESC = {
  "Budget Area":    "Entry-level · High volume · Value seekers",
  "Mid-Value Area": "Mid-range · Growing areas · Solid demand",
  "Premium Area":   "Quality stock · DHA/Clifton · High intent",
  "Luxury Area":    "Ultra-premium · Low inventory · HNW clients"
};

// ── Helpers ───────────────────────────────────────────────────
const fmt = n => {
  if (n == null || n === "" || isNaN(n)) return "–";
  n = Number(n);
  if (n >= 10_000_000) return (n/10_000_000).toFixed(1) + " Cr";
  if (n >= 100_000)    return (n/100_000).toFixed(1) + " L";
  return n.toLocaleString();
};
const fmtPsf  = n => (!n || isNaN(n)) ? "–" : "₨" + Number(n).toLocaleString(undefined,{maximumFractionDigits:0}) + "/sqft";
const fmtArea = n => (!n || isNaN(n)) ? "–" : Number(n).toLocaleString(undefined,{maximumFractionDigits:0}) + " sqft";
const fmtN    = (n,d=1) => (n==null||isNaN(n)) ? "–" : Number(n).toFixed(d);
const scoreColor = s => s >= 70 ? "var(--green)" : s >= 40 ? "var(--yellow)" : "var(--red)";
const scoreLabel = s => s >= 70 ? "HIGH" : s >= 40 ? "MED" : "LOW";
const numStr = s => s ? (String(s).replace(/[^0-9.]/g,'') || "–") : "–";
const san = str => {
  if (!str) return "–";
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
};

async function apiGet(path) {
  try {
    const r = await fetch(API + path);
    if (!r.ok) throw new Error(r.statusText);
    return r.json();
  } catch(e) {
    console.error('API error:', path, e.message);
    return {};
  }
}

// ── State ─────────────────────────────────────────────────────
let state = {

// ── Sidebar stats ─────────────────────────────────────────────
async function loadSidebarStats() {
  const s = await apiGet('/api/summary');

  set('sb-total', s.total_leads != null ? Number(s.total_leads).toLocaleString() : "–");

}

// ── SVG bar chart ─────────────────────────────────────────────
function svgBars(id, data, key, labelFn, colorFn, valFn, W=360, H=165) {
  const el = document.getElementById(id);
  if (!el || !data?.length) return;
  const valid = data.filter(d => d[key] != null && !isNaN(d[key]));
  if (!valid.length) return;
  const PAD=32, max=Math.max(...valid.map(d=>+d[key]),1);
  const bw = (W-PAD*2)/valid.length;
  const bars = valid.map((d,i) => {
    const val=+d[key], bh=Math.max((val/max)*(H-52),2);
    const x=PAD+i*bw+bw*.12, y=H-bh-24, c=colorFn(d), lbl=labelFn(d);
    return `<rect x="${x}" y="${y}" width="${bw*.76}" height="${bh}" rx="2" fill="${c}" opacity=".75"/>
            <text x="${x+bw*.38}" y="${H-5}" text-anchor="middle" font-size="8" fill="var(--text3)" font-family="DM Mono">${lbl}</text>
            <text x="${x+bw*.38}" y="${y-5}" text-anchor="middle" font-size="8" fill="${c}" font-family="DM Mono">${valFn(val)}</text>`;
  }).join('');
  el.className = 'fade';
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%">${bars}</svg>`;
}

// ── Segment donut ─────────────────────────────────────────────
function renderDonut(id, segsObj) {
  const el = document.getElementById(id);
  if (!el) return;
  const segs = Object.entries(segsObj);
  const total = segs.reduce((a,[,v])=>a+v,0)||1;
  let cum = 0;
  const R=50, cx=68, cy=68;
  const paths = segs.map(([name,val]) => {
    const pct=val/total, start=cum*2*Math.PI-Math.PI/2;
    cum += pct;
    const end=cum*2*Math.PI-Math.PI/2;
    const x1=cx+R*Math.cos(start), y1=cy+R*Math.sin(start);
    const x2=cx+R*Math.cos(end),   y2=cy+R*Math.sin(end);
    return `<path d="M${cx},${cy} L${x1},${y1} A${R},${R} 0 ${pct>.5?1:0},1 ${x2},${y2} Z" fill="${SEG_COLOR[name]||'#888'}" opacity=".8"/>`;
  }).join('');
  const legend = segs.map(([name,val]) => `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <div style="width:6px;height:6px;border-radius:2px;background:${SEG_COLOR[name]||'#888'};flex-shrink:0"></div>
      <span style="font-size:11px;color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</span>
      <span style="font-family:var(--mono);font-size:10px;color:var(--text)">${val}</span>
      <span style="font-family:var(--mono);font-size:9px;color:var(--text3)">${((val/total)*100).toFixed(0)}%</span>
    </div>`).join('');
  el.className = 'fade';
  el.innerHTML = `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 136 136" style="width:118px;height:118px;flex-shrink:0">
      ${paths}
      <circle cx="${cx}" cy="${cy}" r="26" fill="var(--surf)"/>
      <text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="12" fill="var(--text2)" font-family="DM Mono">${total}</text>
    </svg>
    <div style="flex:1;min-width:130px">${legend}</div>
  </div>`;
}

async function renderLeads() {
  const el = document.getElementById('main');
  const f = state.f;

  el.innerHTML = `
    <div class="pg-eyebrow">LIVE DATABASE</div>
    <div class="pg-title">All Leads</div>
    <div class="pg-sub" id="leads-sub">Loading…</div>

    <div class="filter-bar">
      <div class="fg">
        <label>SEGMENT</label>
        <select onchange="setFilter('segment',this.value)" style="width:145px">
          <option value="">All Segments</option>
          ${["Budget Area","Mid-Value Area","Premium Area","Luxury Area"].map(s=>`<option value="${s}" ${f.segment===s?"selected":""}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="fg">
        <label>BEDROOMS</label>
        <select onchange="setFilter('bedrooms',this.value)" style="width:100px">
          <option value="">Any</option>

        </select>
      </div>
      <div class="fg">
        <label>MIN SCORE</label>
        <input type="number" min="0" max="100" placeholder="0–100" style="width:80px" value="${f.min_score||""}" oninput="setFilter('min_score',this.value)">
      </div>
      <div class="fg">
        <label>MIN PRICE (Lakh)</label>

      </div>
      <div class="fg">
        <label>MAX PRICE (Lakh)</label>
        <input type="number" min="0" placeholder="e.g. 500" style="width:90px" value="${f.max_price?f.max_price/100000:""}" oninput="setFilter('max_price',this.value?this.value*100000:'')">
      </div>
      <div class="fg">
        <label>LOCATION</label>
        <input type="text" placeholder="Search area…" style="width:140px" value="${f.location||""}" oninput="setFilter('location',this.value)">
      </div>
      <div class="fg">
        <label>SORT BY</label>
        <select onchange="setFilter('sort_by',this.value)" style="width:130px">
          <option value="lead_score"     ${f.sort_by==="lead_score"?"selected":""}>Score ↓</option>
          <option value="price"          ${f.sort_by==="price"?"selected":""}>Price ↓</option>
          <option value="area_sqft"      ${f.sort_by==="area_sqft"?"selected":""}>Area ↓</option>
          <option value="price_per_sqft" ${f.sort_by==="price_per_sqft"?"selected":""}>₨/Sqft ↓</option>
        </select>
      </div>
      <button class="btn-reset" onclick="resetFilters()">✕ Reset</button>
      <div class="filter-count" id="leads-count"></div>
    </div>

    <div id="leads-list">
      ${[...Array(5)].map(()=>`<div class="skel" style="height:78px;margin-bottom:8px;border-radius:var(--rl)"></div>`).join('')}
    </div>
    <div class="pagination" id="leads-pagination"></div>`;

  const params = new URLSearchParams();
  if (f.page)    params.set('page',     f.page);
  if (f.limit)   params.set('limit',    f.limit);
  if (f.sort_by) params.set('sort_by',  f.sort_by);
  if (f.segment) params.set('segment',  f.segment);
  if (f.min_score !== "" && f.min_score != null) params.set('min_score', f.min_score);
  if (f.location) params.set('location', f.location);

  const data = await apiGet(`/api/leads?${params.toString()}`);
  let leads = data.leads || [];

  if (f.bedrooms !== "" && f.bedrooms != null) {
    const bd = parseFloat(f.bedrooms);
    leads = leads.filter(l => {
      const b = parseFloat(String(l.bedrooms||'').replace(/[^0-9.]/g,''));
      return !isNaN(b) && b === bd;
    });
  }
  if (f.min_price !== "" && f.min_price != null) {
    leads = leads.filter(l => parseFloat(l.price||0) >= parseFloat(f.min_price));
  }
  if (f.max_price !== "" && f.max_price != null) {
    leads = leads.filter(l => parseFloat(l.price||0) <= parseFloat(f.max_price));
  }

  const total   = data.total ?? 0;
  const curPage = data.page  ?? f.page;
  const pages   = data.pages ?? 1;

  let pHTML = '';

  if (totalPages > 1) {
    if (curPage > 1) pHTML += `<button class="pg-btn" onclick="goPage(${curPage-1})">← Prev</button>`;

      if (p===1||p===totalPages||Math.abs(p-curPage)<=2) {
        pHTML += `<button class="pg-btn ${p===curPage?"active":""}" onclick="goPage(${p})">${p}</button>`;
      } else if (Math.abs(p-curPage)===3) {
        pHTML += `<span class="pg-ellipsis">…</span>`;
      }
    }
    if (curPage < totalPages) pHTML += `<button class="pg-btn" onclick="goPage(${curPage+1})">Next →</button>`;
  }
  document.getElementById('leads-pagination').innerHTML = pHTML;
}

function buildLeadCard(l, idx) {
  const s=Math.round(l.lead_score||0), c=scoreColor(s), sc=SEG_COLOR[l.market_segment]||"var(--text2)";
  const beds=numStr(l.bedrooms), baths=numStr(l.bathrooms);
  const psf=l.price_per_sqft ? Number(l.price_per_sqft).toLocaleString(undefined,{maximumFractionDigits:0}) : '–';
  const isVer=String(l.verified_agency||'').toLowerCase()==='verified';

  return `<div class="lead-card fade" style="border-left-color:${c};animation-delay:${idx*.025}s">
    <div class="lead-hdr" onclick="toggleCard(this)">
      <div style="flex:1;min-width:0">
        <div class="lead-title" title="${san(l.title)}">${san(l.title)||"Untitled"}</div>
        <div class="lead-chips">
          <span class="chip" style="color:var(--accent);font-weight:600">${fmt(l.price)}</span>
          <span class="chip-sep">·</span>
          <span class="chip">${fmtArea(l.area_sqft)}</span>
          <span class="chip-sep">·</span>
          <span class="chip">${beds}🛏 ${baths}🚿</span>
          <span class="chip-sep">·</span>
          <span class="chip" style="color:var(--purple)">₨${psf}/sqft</span>
          <span class="badge" style="background:${sc}18;color:${sc};border:1px solid ${sc}30">${l.market_segment||"—"}</span>
          ${isVer?`<span class="badge badge-verified">✓ Verified</span>`:''}
        </div>
        <div class="lead-loc">
          📍 ${san(l.location)||"–"}
          ${l.agent_name ? `<span class="chip-sep">·</span><span>${san(l.agent_name)}</span>` : ''}
          ${l.agency_name ? `<span class="chip-sep">·</span><span style="color:var(--text3)">${san(l.agency_name)}</span>` : ''}

function toggleCard(hdr) {
  const body = hdr.nextElementSibling;
  const open = body.style.display === "block";
  body.style.display = open ? "none" : "block";
  const icon = hdr.querySelector('.expand-icon');
  if (icon) icon.textContent = open ? "▾ expand" : "▴ collapse";
}

function copyContact(evt, data) {
  if (!data) return;
  const txt = [
    data.name    ? `Agent: ${data.name}`     : null,
    data.agency  ? `Agency: ${data.agency}`  : null,
    data.phone   ? `Phone: ${data.phone}`    : null,
    data.email   ? `Email: ${data.email}`    : null,
    data.location? `Location: ${data.location}` : null,
    data.price   ? `Price: ${fmt(data.price)}` : null,
  ].filter(Boolean).join('\n');
  navigator.clipboard.writeText(txt).then(() => {
    const btn = evt.currentTarget;
    btn.textContent = '✓ Copied!';
    setTimeout(() => btn.textContent = '📋 Copy Contact', 1600);
  }).catch(() => {});
}

function setFilter(key, val) {
  state.f[key] = val;
  state.f.page = 1;
  renderLeads();
}

function goPage(p) {
  state.f.page = p;
  renderLeads();
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetFilters() {
  state.f = { page:1, limit:20, sort_by:"lead_score", segment:"", min_score:"", location:"", bedrooms:"", min_price:"", max_price:"" };
  renderLeads();
}

// ══════════════════════════════════════════════════════════════
// ANALYTICS
// ══════════════════════════════════════════════════════════════
async function renderAnalytics() {
  const el = document.getElementById('main');
  el.innerHTML = `
    <div class="pg-eyebrow">MARKET INTELLIGENCE</div>
    <div class="pg-title">Analytics</div>

      <div class="mini-stat skel" style="height:72px" id="ms-3"></div>
      <div class="mini-stat skel" style="height:72px" id="ms-4"></div>
    </div>

    <div class="g3">
      <div class="panel"><div class="panel-eyebrow">PRICING</div><div class="panel-title">Avg Price by Segment</div><div id="c-price" style="height:170px" class="skel"></div></div>

        <div class="panel-eyebrow">VOLUME</div>

      </div>
    </div>

    <div class="tbl-wrap">
      <div class="tbl-hdr"><div><div class="panel-eyebrow">COMPARATIVE</div><div style="font-weight:700;font-size:13px">Segment Statistics</div></div></div>
      <div id="seg-tbl"><div class="skel" style="height:120px;margin:16px"></div></div>
    </div>`;

  const [segs, locs] = await Promise.all([apiGet('/api/trends/segments'), apiGet('/api/trends/locations')]);
  const segsArr = Array.isArray(segs) ? segs : [];

  const totalListings = segsArr.reduce((a,s)=>a+(s.count||0),0);
  const avgPsf = segsArr.length ? segsArr.reduce((a,s)=>a+(parseFloat(s.avg_price_per_sqft||0)),0)/segsArr.length : 0;
  const topSeg = segsArr.length ? [...segsArr].sort((a,b)=>(b.count||0)-(a.count||0))[0] : null;
  const topScore = segsArr.length ? [...segsArr].sort((a,b)=>(b.avg_score||0)-(a.avg_score||0))[0] : null;
  [
    { label:"TOTAL LISTINGS", val:totalListings.toLocaleString(), color:"var(--accent)" },
    { label:"AVG ₨/SQFT",     val:avgPsf?"₨"+Math.round(avgPsf).toLocaleString():"–", color:"var(--purple)" },
    { label:"TOP BY VOLUME",  val:topSeg?.market_segment?.replace(' Area','')||"–", color:SEG_COLOR[topSeg?.market_segment]||"var(--text2)" },
    { label:"TOP BY SCORE",   val:topScore?.market_segment?.replace(' Area','')||"–", color:"var(--yellow)" },
  ].forEach((m,i) => {
    const el2 = document.getElementById(`ms-${i+1}`);
    if (el2) { el2.className='mini-stat fade'; el2.innerHTML=`<div class="mini-stat-label">${m.label}</div><div class="mini-stat-val" style="color:${m.color}">${m.val}</div>`; }
  });

  const lf = d => (d.market_segment||"").replace(" Area","").slice(0,7);
  const cf = d => SEG_COLOR[d.market_segment]||"var(--accent)";
  svgBars('c-price', segsArr, 'avg_price',         lf, cf, v=>fmt(v));
  svgBars('c-score', segsArr, 'avg_score',          lf, cf, v=>Math.round(v||0));
  svgBars('c-psf',   segsArr, 'avg_price_per_sqft', lf, cf, v=>v?Math.round(v).toLocaleString():'–');
  svgBars('c-count', segsArr, 'count',              lf, cf, v=>v);

  const locsArr = Array.isArray(locs) ? locs : [];
  const maxLoc = locsArr[0]?.count||1;
  document.getElementById('loc-list').innerHTML = locsArr.length ?
    `<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 24px">
      ${locsArr.slice(0,20).map((l,i)=>`
        <div class="loc-row">
          <span class="loc-rank">${i+1}</span>
          <div style="flex:1;min-width:0">
            <div style="display:flex;justify-content:space-between;margin-bottom:3px">
              <span style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px">${san(l.location)||"Unknown"}</span>
              <span style="font-family:var(--mono);font-size:9px;color:var(--accent);margin-left:6px">${l.count}</span>
            </div>
            <div class="loc-bar-bg"><div class="loc-bar-fill" style="width:${(l.count/maxLoc*100).toFixed(0)}%"></div></div>
          </div>
          <span style="font-family:var(--mono);font-size:9px;color:var(--text3);min-width:28px;text-align:right">${fmtN(l.avg_score,0)}</span>
        </div>`).join('')}
    </div>` :
    `<div class="empty"><div class="empty-text">No location data</div></div>`;

  document.getElementById('seg-tbl').innerHTML = segsArr.length ?
    `<table><thead><tr>
      <th>SEGMENT</th><th>LISTINGS</th><th>AVG PRICE</th><th>AVG ₨/SQFT</th><th>AVG AREA</th><th>AVG BEDS</th><th>AVG BATHS</th><th>AVG SCORE</th>
    </tr></thead><tbody>
      ${segsArr.map(seg => {
        const sc=SEG_COLOR[seg.market_segment]||"var(--text2)";
        return `<tr>
          <td><span class="badge" style="background:${sc}18;color:${sc};border:1px solid ${sc}30">${seg.market_segment||"–"}</span></td>
          <td style="font-family:var(--mono)">${(seg.count||"–").toLocaleString?.()}</td>
          <td style="font-family:var(--mono);color:var(--accent)">${fmt(seg.avg_price)}</td>
          <td style="font-family:var(--mono);color:var(--purple)">${fmtPsf(seg.avg_price_per_sqft)}</td>
          <td style="font-family:var(--mono)">${fmtArea(seg.avg_area_sqft)}</td>
          <td style="font-family:var(--mono)">${fmtN(seg.avg_bedrooms,1)}</td>
          <td style="font-family:var(--mono)">${fmtN(seg.avg_bathrooms,1)}</td>
          <td>
            <div class="score-bar-wrap">
              <div class="score-bar-bg"><div class="score-bar-fill" style="width:${Math.round(seg.avg_score||0)}%;background:${scoreColor(seg.avg_score||0)}"></div></div>
              <span style="font-family:var(--mono);font-size:10px;color:${scoreColor(seg.avg_score||0)}">${fmtN(seg.avg_score,1)}</span>
            </div>
          </td>
        </tr>`;
      }).join('')}
    </tbody></table>` :
    `<div class="empty"><div class="empty-text">No segment data</div></div>`;
}

async function renderSegments() {
  const el = document.getElementById('main');
  el.innerHTML = `
    <div class="pg-eyebrow">MARKET SEGMENTATION</div>
    <div class="pg-title">Segment Intelligence</div>
    <div class="pg-sub">KMeans K=4 clustering · Price tiers · Opportunity scoring</div>
    <div id="seg-cards" class="g2eq">
      ${[...Array(4)].map(()=>`<div class="skel" style="height:220px;border-radius:var(--rl)"></div>`).join('')}
    </div>`;

  const segs = await apiGet('/api/trends/segments');
  const segsArr = Array.isArray(segs) ? segs : [];

  document.getElementById('seg-cards').innerHTML = segsArr.length ?
    segsArr.map(seg => {
      const sc=SEG_COLOR[seg.market_segment]||"var(--text2)";
      const desc=SEG_DESC[seg.market_segment]||"";
      return `<div class="seg-card fade" style="border-top:2px solid ${sc}20;border-left:3px solid ${sc}">
        <div class="seg-hdr">
          <div class="seg-swatch" style="background:${sc}"></div>
          <div>
            <div style="font-weight:800;font-size:15px">${seg.market_segment||"Unknown"}</div>
            <div style="font-size:11px;color:var(--text2);margin-top:3px">${desc}</div>
          </div>
        </div>
        <div class="seg-stats">
          <div class="seg-stat"><div class="seg-stat-label">LISTINGS</div><div class="seg-stat-val" style="color:${sc}">${(seg.count||"–").toLocaleString?.()}</div></div>
          <div class="seg-stat"><div class="seg-stat-label">AVG SCORE</div><div class="seg-stat-val" style="color:${scoreColor(seg.avg_score||0)}">${fmtN(seg.avg_score,1)}</div></div>
          <div class="seg-stat"><div class="seg-stat-label">AVG PRICE</div><div class="seg-stat-val" style="color:var(--accent);font-size:14px">${fmt(seg.avg_price)}</div></div>
          <div class="seg-stat"><div class="seg-stat-label">AVG ₨/SQFT</div><div class="seg-stat-val" style="color:var(--purple);font-size:14px">${fmtPsf(seg.avg_price_per_sqft)}</div></div>
          <div class="seg-stat"><div class="seg-stat-label">AVG AREA</div><div class="seg-stat-val" style="font-size:13px">${fmtArea(seg.avg_area_sqft)}</div></div>
          <div class="seg-stat"><div class="seg-stat-label">AVG BEDS</div><div class="seg-stat-val" style="font-size:13px">${fmtN(seg.avg_bedrooms,1)}</div></div>

// ── Router ────────────────────────────────────────────────────
function render() {
  document.getElementById('main').innerHTML = '';
  if      (state.page==='dashboard') renderDashboard();
  else if (state.page==='leads')     renderLeads();
  else if (state.page==='analytics') renderAnalytics();
  else if (state.page==='segments')  renderSegments();
}

loadSidebarStats();
render();
</script>
